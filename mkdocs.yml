site_name: RDK Classroom
site_description: Developer tutorials and hands-on learning for D-Robotics RDK platforms.
site_url: https://d-robotics.github.io/rdk-course-demos/
repo_url: https://github.com/D-Robotics/rdk-course-demos
repo_name: D-Robotics/rdk-course-demos
edit_uri: edit/develop/docs/

theme:
  name: material
  language: en
  logo: assets/images/d-robotics-logo.png
  favicon: assets/images/d-robotics-logo.png
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/brand.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: 面向 D-Robotics RDK 开发者的教程与实战课程。
          nav_translations:
            Home: 首页
            Course introduction: 课程介绍
            01 · Fundamentals: 01 · 基础入门
            Course outline: 课程大纲
            Common foundation: 通用基础
            Flash a system image: 烧录系统镜像
            Boot troubleshooting: 启动问题排查
            Remote access: 远程连接
            Audio peripherals: 音频外设入门
            Video codec: 编解码
            40-pin GPIO and PWM: 40-pin GPIO 与 PWM
            40-pin UART and I2C: 40-pin UART 与 I2C
            40-pin SPI: 40-pin SPI
            CAN communication: CAN 通信
            RDK community and ecosystem: RDK 社区与生态入门
            RDK hardware portfolio: RDK 硬件全家桶
            Getting started with RDK Studio: RDK Studio 入门
            RDK X5: RDK X5
            RDK S100: RDK S100
            02 · ModelZoo & RoboGo: 02 · ModelZoo 与 RoboGo
            Course overview: 课程介绍
            03 · TROS: 03 · TROS
            04 · System & drivers: 04 · 系统与驱动
            05 · LLMs & embodied AI: 05 · 大模型与具身智能

  - redirects:
      redirect_maps:
        beginner/01-community-ecosystem.md: beginner/common/community-ecosystem.md
        zh/beginner/01-community-ecosystem.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/common/community-ecosystem/
        beginner/02-product-intro.md: beginner/common/product-intro.md
        zh/beginner/02-product-intro.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/common/product-intro/
        beginner/03-rdk-studio.md: beginner/common/rdk-studio.md
        zh/beginner/03-rdk-studio.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/common/rdk-studio/
        beginner/04-flash-system-s100.md: beginner/s100/flash-system.md
        zh/beginner/04-flash-system-s100.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/s100/flash-system/
        beginner/04-flash-system-x5.md: beginner/x5/flash-system.md
        zh/beginner/04-flash-system-x5.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/flash-system/
        beginner/05-boot-troubleshooting-s100.md: beginner/s100/boot-troubleshooting.md
        zh/beginner/05-boot-troubleshooting-s100.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/s100/boot-troubleshooting/
        beginner/05-boot-troubleshooting-x5.md: beginner/x5/boot-troubleshooting.md
        zh/beginner/05-boot-troubleshooting-x5.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/boot-troubleshooting/
        beginner/06-remote-connection-s100.md: beginner/s100/remote-connection.md
        zh/beginner/06-remote-connection-s100.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/s100/remote-connection/
        beginner/08-audio-s100.md: beginner/s100/audio.md
        zh/beginner/08-audio-s100.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/s100/audio/
        beginner/08-audio.md: beginner/x5/audio.md
        zh/beginner/08-audio.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/audio/
        beginner/10-codec-s100.md: beginner/s100/codec.md
        zh/beginner/10-codec-s100.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/s100/codec/
        beginner/10-codec-x5.md: beginner/x5/codec.md
        zh/beginner/10-codec-x5.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/codec/
        beginner/11-40pin-gpio-pwm.md: beginner/x5/40pin-gpio-pwm.md
        zh/beginner/11-40pin-gpio-pwm.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/40pin-gpio-pwm/
        beginner/12-40pin-uart.md: beginner/x5/40pin-uart.md
        zh/beginner/12-40pin-uart.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/40pin-uart/
        hardware/spi-display.md: beginner/x5/spi-display.md
        zh/hardware/spi-display.md: https://d-robotics.github.io/rdk-course-demos/zh/beginner/x5/spi-display/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Course introduction: course-overview.md
  - 01 · Fundamentals:
      - Course outline: beginner/index.md
      - Common foundation:
          - RDK community and ecosystem: beginner/common/community-ecosystem.md
          - RDK hardware portfolio: beginner/common/product-intro.md
          - Getting started with RDK Studio: beginner/common/rdk-studio.md
      - RDK X5:
          - Flash a system image: beginner/x5/flash-system.md
          - Boot troubleshooting: beginner/x5/boot-troubleshooting.md
          - Audio peripherals: beginner/x5/audio.md
          - Video codec: beginner/x5/codec.md
          - 40-pin GPIO and PWM: beginner/x5/40pin-gpio-pwm.md
          - 40-pin UART and I2C: beginner/x5/40pin-uart.md
          - 40-pin SPI: beginner/x5/spi-display.md
          - CAN communication: beginner/x5/can.md
      - RDK S100:
          - Flash a system image: beginner/s100/flash-system.md
          - Boot troubleshooting: beginner/s100/boot-troubleshooting.md
          - Remote access: beginner/s100/remote-connection.md
          - Audio peripherals: beginner/s100/audio.md
          - Video codec: beginner/s100/codec.md
          - 40-pin GPIO and PWM: beginner/s100/40pin-gpio-pwm.md
          - 40-pin UART and I2C: beginner/s100/40pin-uart-i2c.md
          - 40-pin SPI: beginner/s100/40pin-spi.md
          - CAN communication: beginner/s100/can.md
  - 02 · ModelZoo & RoboGo:
      - Course overview: modelzoo/index.md
  - 03 · TROS:
      - Course overview: tros/index.md
  - 04 · System & drivers:
      - Course overview: system-drivers/index.md
  - 05 · LLMs & embodied AI:
      - Course overview: embodied-ai/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/D-Robotics/rdk-course-demos
      name: RDK Classroom on GitHub
  generator: false

copyright: Copyright &copy; D-Robotics
