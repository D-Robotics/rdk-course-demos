# 2-05 · featuremap PTQ · S100 (nash-e) · selftrain YOLO11n
# Compile (oe-s): hb_compile --config ptq_featuremap_s100.yaml
# march locked: oe-s hb_compile --help + board model_info旁证

model_parameters:
  onnx_model: './onnx/selftrain_yolo11n_detect_opset19.onnx'
  march: 'nash-e'
  layer_out_dump: False
  working_dir: 'bpu_out_selftrain_yolo11n_featuremap_nashe'
  output_model_file_prefix: 'selftrain_yolo11n_detect_nashe_640x640_featuremap'

input_parameters:
  input_name: ""
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_layout_rt: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './cal_featuremap_s100_npy'
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  extra_params: {'input_no_padding': True, 'output_no_padding': True}
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O2'
