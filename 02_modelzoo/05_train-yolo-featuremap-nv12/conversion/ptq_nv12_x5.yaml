# 2-05 · NV12 PTQ · X5 (bayes-e) · selftrain YOLO11n
# Compile (oe-x5): hb_mapper makertbin --config ptq_nv12_x5.yaml --model-type onnx

model_parameters:
  onnx_model: './onnx/selftrain_yolo11n_detect_opset11.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: 'bpu_out_selftrain_yolo11n_nv12_bayese'
  output_model_file_prefix: 'selftrain_yolo11n_detect_bayese_640x640_nv12'

input_parameters:
  input_name: ""
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: './cal_nv12_rgb_f32'
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: set_Softmax_input_int8,set_Softmax_output_int8

compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O3'
