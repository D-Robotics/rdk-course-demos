# 2-05 · featuremap PTQ · X5 (bayes-e) · selftrain YOLO11n
# Compile (oe-x5): hb_mapper makertbin --config ptq_featuremap_x5.yaml --model-type onnx
# Working dir inside container: /workspace/course_2-05

model_parameters:
  onnx_model: './onnx/selftrain_yolo11n_detect_opset11.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: 'bpu_out_selftrain_yolo11n_featuremap_bayese'
  output_model_file_prefix: 'selftrain_yolo11n_detect_bayese_640x640_featuremap'

input_parameters:
  input_name: ""
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_layout_rt: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './cal_featuremap_x5_rgbchw'
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: set_Softmax_input_int8,set_Softmax_output_int8

compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O3'
