# 2-05 · NV12 PTQ · S100 (nash-e) · selftrain YOLO11n
# Compile (oe-s): hb_compile --config ptq_nv12_s100.yaml

model_parameters:
  onnx_model: './onnx/selftrain_yolo11n_detect_opset19.onnx'
  march: 'nash-e'
  layer_out_dump: False
  working_dir: 'bpu_out_selftrain_yolo11n_nv12_nashe'
  output_model_file_prefix: 'selftrain_yolo11n_detect_nashe_640x640_nv12'

input_parameters:
  input_name: ""
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  mean_value: ''
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: './cal_nv12_s100_npy'
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  extra_params: {'input_no_padding': True, 'output_no_padding': True}
  jobs: 8
  compile_mode: 'latency'
  debug: true
  advice: 1
  optimize_level: 'O2'
